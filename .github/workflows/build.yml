name: Java CI with Gradle

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
    - name: Unzip and Move Files
      run: |
        unzip -q "*.zip" -d extracted_project
        # Ищем, где лежит build.gradle, и переносим всё содержимое этой папки в корень
        TARGET_DIR=$(find extracted_project -name "build.gradle" -exec dirname {} \;)
        if [ -n "$TARGET_DIR" ]; then
          cp -r $TARGET_DIR/* .
        fi
        rm -rf extracted_project
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
    - name: Build with Gradle
      run: chmod +x gradlew && ./gradlew build
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DoomChainSpearMod
        path: build/libs/*.jar
