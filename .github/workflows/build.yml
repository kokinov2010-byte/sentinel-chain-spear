name: Java CI with Gradle

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
    - name: Unzip project archive
      run: |
        mkdir -p unpacked
        unzip -q "*.zip" -d unpacked/
        # Проверяем, куда распаковались файлы, и переносим их в корень проекта
        INNER_DIR=$(find unpacked -name "build.gradle" -exec dirname {} \;)
        if [ -z "$INNER_DIR" ]; then
          INNER_DIR="unpacked"
        fi
        cp -r $INNER_DIR/* . || true
        rm -rf unpacked
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
    - name: Build mod package
      run: |
        chmod +x gradlew || true
        ./gradlew build --no-daemon
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DoomChainSpearMod
        path: build/libs/*.jar
