name: Java CI with Gradle

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        
    - name: Unzip Archive Cleanly
      run: |
        python3 -c "import zipfile, glob; zip = zipfile.ZipFile(glob.glob('*.zip')); zip.extractall('.')"
        
    - name: Generate Missing Gradle Wrapper
      run: |
        # Эта команда принудительно создаёт недостающий gradlew прямо на сервере
        gradle wrapper --gradle-version 8.7
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      
    - name: Build Mod Package
      run: |
        chmod +x gradlew
        ./gradlew build --no-daemon
        
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DoomChainSpearMod
        path: build/libs/*.jar
